<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Posto Elétrico Goodwe</title>
</head>
<body class="content">
    <h1 class="title">Simulador de Recarga Goodwe</h1>

    <div class="list">
        <button type="button" class="list_item" id="btn_adicionar_carro">1. Conectar/Simular Entrada de Carro</button>
        <button type="button" class="list_item" id="btn_monitoramento">2. Ver Carregamento em Tempo Real (Monitoramento)</button>
        
        <div class="list_group">
            <button type="button" class="list_item group_btn" id="btn_ordenar">3. Ordenar Sessão</button>
            <select id="criterio_ordenacao" class="group_select">
                <option value="id">Por ID/Vaga</option>
                <option value="bateria">Por % Bateria</option>
                <option value="energia">Por Energia</option>
            </select>
        </div>

        <div class="list_group">
            <button type="button" class="list_item group_btn" id="btn_buscar">4. Buscar Sessão</button>
            <input type="number" id="input_vaga_busca" class="group_select" placeholder="Nº Vaga" min="1">
        </div>

        <button type="button" class="list_item" id="btn_relatorio">5. Exibir o Relatório e Sair do Sistema</button>
    </div>

    <!-- Mensagem de feedback -->
    <p id="mensagem" class="mensagem_confirm"></p>

    <!-- Container do Card Buscado -->
    <div id="container_resultado_busca" style="max-width: 400px; margin: 20px auto; width: 100%;"></div>

    <!-- Importação correta do JS -->
    <script src="../static/js/menu.js"></script>
</body>
</html>
