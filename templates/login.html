<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/style.css">
    <title>Login</title>
</head>
<body class="content">
    <h1 class="title" id="title">Login</h1>
    <div class="login_options">    
        <button id="show_signin" class='login_options_option'>Sign in</button>
        <button id="show_signup" class='login_options_option'>Sign up</button>
    </div>
    <div class="login_inputs input_signin hidden">
        <input type="input" placeholder="E-mail" id="e-mail" class="login_inputs_input">
        <input type="input" placeholder="Senha" id="senha" class="login_inputs_input">
        <button class="login_inputs_enviar" id="enviar">Enviar</button>
    </div>
    <div class="login_inputs input_signup hidden">
        <input type="input" placeholder="E-mail" id="e-mail" class="login_inputs_input">
        <input type="input" placeholder="Senha" id="senha" class="login_inputs_input">
        <input type="input" placeholder="Confirme sua Senha" id="confirm_senha" class="login_inputs_input">
        <button class="login_inputs_enviar" id="enviar">Enviar</button>
    </div>
</body>
<script src="../assets/script.js"></script>
</html>
